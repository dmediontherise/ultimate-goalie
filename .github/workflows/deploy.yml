name: CI

# GitHub Pages for this repo is configured as a legacy build serving master:/docs
# directly, so pushing to master publishes on its own - there is no deploy step to
# run here. This workflow's job is to prove that the committed docs/ build is the
# one the source actually produces, and that the suite is green.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify committed docs/ matches the build
        run: |
          if [ -n "$(git status --porcelain docs)" ]; then
            echo "::error::docs/ is out of date with the source. Run 'npm run build' and commit the result."
            git status --porcelain docs
            exit 1
          fi
          echo "docs/ matches the build output."
